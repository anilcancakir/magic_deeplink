name: magic_deeplink
description: "Open the right Magic route from Universal Links, App Links and push taps: config-driven handlers plus a CLI that generates the association files."
version: 1.0.1
homepage: https://anilcancakir.com/magic/deeplink
repository: https://github.com/anilcancakir/magic_deeplink
issue_tracker: https://github.com/anilcancakir/magic_deeplink/issues

topics:
  - deeplink
  - universal-links
  - app-links
  - magic-framework

environment:
  sdk: ">=3.13.0 <4.0.0"
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  # The floor names magic 1.0.0, the first stable release, so `^1.0.0` takes
  # every 1.x release. `DeeplinkOpened` and `DeeplinkNavigating` implement its
  # `ReportsBreadcrumb`.
  magic: ^1.0.0
  dowel: ^1.0.0
  app_links: ^7.2.2
  args: ^2.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  test: ^1.32.0
  flutter_lints: ^6.0.0
  material_ui: ^1.11.0

