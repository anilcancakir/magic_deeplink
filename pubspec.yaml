name: magic_deeplink
description: "Open the right Magic route from Universal Links, App Links and push taps: config-driven handlers plus a CLI that generates the association files."
version: 1.0.0
homepage: https://anilcancakir.com/magic/deeplink
repository: https://github.com/anilcancakir/magic_deeplink
issue_tracker: https://github.com/anilcancakir/magic_deeplink/issues

topics:
  - deeplink
  - universal-links
  - app-links
  - magic-framework

environment:
  sdk: ">=3.13.0 <4.0.0"
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  # TWO reasons stacked, and they answer different questions.
  #
  # The floor cannot go below 0.0.8: `MagicApp.register` returns `void` there
  # and `Future<void>` from 0.0.8 on, and this package's suite awaits it, so
  # at `^0.0.5` the library analyzed clean while the tests did not compile.
  #
  # It sits at 0.0.22 because `DeeplinkOpened` and `DeeplinkNavigating`
  # implement `ReportsBreadcrumb`, which 0.0.22 introduces. 0.0.14 is where an
  # unresolvable route middleware alias stops the app at `Magic.init` instead
  # of leaving the route ungated, which is a breaking change a consumer of
  # this package inherits. The floor names 1.0.0, the first stable release,
  # which also moved the optional layers out of core into plugin packages.
  magic: ^1.0.0
  dowel: ^1.0.0
  app_links: ^7.2.2
  args: ^2.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  test: ^1.32.0
  flutter_lints: ^6.0.0
  material_ui: ^1.11.0

