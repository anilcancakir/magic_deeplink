name: Bug Report
description: Report a bug in Magic Deeplink Plugin
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! Please fill in the details below.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug.
      placeholder: What happened?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce this bug?
      placeholder: |
        1. Register `DeeplinkServiceProvider` in config
        2. Open app via universal link `https://example.com/monitors/123`
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behaviour
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behaviour
      description: What actually happened?
    validations:
      required: true

  - type: dropdown
    id: module
    attributes:
      label: Module
      description: Which part of the plugin is affected?
      options:
        - DeeplinkManager (Singleton, URI handling)
        - Drivers (AppLinksDriver, platform detection)
        - Handlers (RouteDeeplinkHandler, OneSignalDeeplinkHandler)
        - Service Provider (Registration, Boot)
        - CLI (Install, Generate commands)
        - Configuration
        - Other
    validations:
      required: true

  - type: textarea
    id: code
    attributes:
      label: Minimal Reproduction Code
      description: A minimal code snippet to reproduce the issue.
      render: dart

  - type: input
    id: plugin-version
    attributes:
      label: Magic Deeplink Version
      placeholder: "1.0.1"
    validations:
      required: true

  - type: input
    id: magic-version
    attributes:
      label: Magic Framework Version
      placeholder: "1.0.0"
    validations:
      required: true

  - type: input
    id: flutter-version
    attributes:
      label: Flutter Version
      placeholder: "Flutter 3.47.0 / Dart 3.13.0"
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - iOS
        - Android
        - macOS
        - All
    validations:
      required: true
